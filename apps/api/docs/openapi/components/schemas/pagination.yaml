# ADR-0004: cursor pagination.
Pagination:
  type: object
  additionalProperties: false
  required: [nextCursor, hasMore, totalCount]
  properties:
    nextCursor:
      type: [string, "null"]
      description: Opaque. Pass back unchanged as `cursor`; `null` on the last page.
    hasMore:
      type: boolean
    totalCount:
      type: integer
      minimum: 0
      description: Matching items across all pages, under the same filters.
