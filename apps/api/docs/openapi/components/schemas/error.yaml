ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Application-specific error code.
          enum:
            - INVALID_JSON
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - INTERNAL_SERVER_ERROR
            - RATE_LIMIT_EXCEEDED

        message:
          type: string
          description: Human-readable error message.

        details:
          type: object
          description: |
            Optional additional error information.
            For validation errors, this contains an issues array
            generated by Zod.
          additionalProperties: true
