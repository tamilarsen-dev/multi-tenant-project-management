# Error envelope: docs/design/api/conventions.md §6, catalog: docs/design/api/errors.md.
ErrorResponse:
  type: object
  additionalProperties: false
  required: [error]
  properties:
    error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/ErrorCode"
        message:
          type: string
          description: Human-readable English message. Clients branch on `code`, never on `message`.
        details:
          description: Present only for codes whose catalog entry defines details.
          oneOf:
            - $ref: "#/ValidationErrorDetails"
            - $ref: "#/VersionConflictDetails"

ErrorCode:
  type: string
  description: |
    Stable machine-readable code. The full catalog is in docs/design/api/errors.md;
    this enum lists the codes the M1 endpoints can return.
  enum:
    - INVALID_JSON
    - VALIDATION_ERROR
    - ROUTE_NOT_FOUND
    - PAYLOAD_TOO_LARGE
    - UNSUPPORTED_MEDIA_TYPE
    - RATE_LIMIT_EXCEEDED
    - INTERNAL_SERVER_ERROR
    - MISSING_AUTHENTICATION
    - INVALID_SESSION
    - INVALID_CREDENTIALS
    - FORBIDDEN
    - ORGANIZATION_NOT_FOUND
    - EMAIL_ALREADY_EXISTS
    - VERSION_CONFLICT

ValidationErrorDetails:
  type: object
  additionalProperties: false
  required: [fields]
  properties:
    fields:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [path, code, message]
        properties:
          path:
            type: array
            description: Body paths are unprefixed; params and query paths start with "params" / "query".
            items:
              oneOf:
                - type: string
                - type: integer
            example: [name]
          code:
            type: string
            example: too_small
          message:
            type: string

VersionConflictDetails:
  type: object
  additionalProperties: false
  required: [currentVersion]
  properties:
    currentVersion:
      type: integer
      minimum: 1
