# DTOs: docs/design/api/contract.md §2.1–2.2. Request bodies reject unknown fields.
Email:
  type: string
  format: email
  maxLength: 254
  description: Trimmed and lowercased before validation and storage.
  example: dana@example.com

RegisterRequest:
  type: object
  additionalProperties: false
  required: [email, password, displayName]
  properties:
    email:
      $ref: "#/Email"
    password:
      type: string
      minLength: 12
      maxLength: 128
      description: Never trimmed or normalized.
      example: correct horse battery
    displayName:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed; must be non-empty afterwards.
      example: Dana

LoginRequest:
  type: object
  additionalProperties: false
  required: [email, password]
  properties:
    email:
      $ref: "#/Email"
    password:
      type: string
      minLength: 1
      maxLength: 128
      description: Any non-empty value; a wrong or short password is INVALID_CREDENTIALS, not a validation error.

User:
  type: object
  additionalProperties: false
  required: [id, email, displayName, createdAt]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    displayName:
      type: string
    createdAt:
      type: string
      format: date-time

Session:
  type: object
  additionalProperties: false
  required: [id, accessToken, tokenType, expiresAt, absoluteExpiresAt]
  properties:
    id:
      type: string
      format: uuid
    accessToken:
      type: string
      description: Opaque bearer token, returned only here. The server stores only its SHA-256 hash.
    tokenType:
      type: string
      enum: [Bearer]
    expiresAt:
      type: string
      format: date-time
      description: Sliding expiry, at most 7 days after issue.
    absoluteExpiresAt:
      type: string
      format: date-time
      description: Hard limit 30 days after login; refresh never extends it.

AuthResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: "#/User"
        session:
          $ref: "#/Session"

RefreshResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: "#/Session"

MeResponse:
  type: object
  required: [data]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/User"
