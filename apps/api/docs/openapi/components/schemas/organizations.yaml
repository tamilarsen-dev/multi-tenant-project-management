# DTOs: docs/design/api/contract.md §2.3–2.4.
OrganizationName:
  type: string
  minLength: 1
  maxLength: 100
  description: Trimmed; must be non-empty afterwards. Not unique.
  example: Acme Engineering

Version:
  type: integer
  minimum: 1
  description: Optimistic-concurrency token (ADR-0007). Send the version you last read.

CreateOrganizationRequest:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      $ref: "#/OrganizationName"

UpdateOrganizationRequest:
  type: object
  additionalProperties: false
  required: [name, version]
  properties:
    name:
      $ref: "#/OrganizationName"
    version:
      $ref: "#/Version"

Organization:
  type: object
  additionalProperties: false
  required: [id, name, version, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    version:
      $ref: "#/Version"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

OrganizationRole:
  type: string
  enum: [OWNER, ADMIN, MEMBER]

MembershipStatus:
  type: string
  enum: [ACTIVE, REMOVED]

Membership:
  type: object
  additionalProperties: false
  required: [id, organizationId, user, role, status, version, joinedAt, removedAt, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    organizationId:
      type: string
      format: uuid
    user:
      type: object
      additionalProperties: false
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    role:
      $ref: "#/OrganizationRole"
    status:
      $ref: "#/MembershipStatus"
    version:
      $ref: "#/Version"
    joinedAt:
      type: string
      format: date-time
    removedAt:
      type: [string, "null"]
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

OrganizationWithMembership:
  type: object
  additionalProperties: false
  required: [organization, membership]
  description: The Organization and the caller's own Membership in it.
  properties:
    organization:
      $ref: "#/Organization"
    membership:
      $ref: "#/Membership"

OrganizationResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: "#/OrganizationWithMembership"

OrganizationListResponse:
  type: object
  required: [data, pagination]
  properties:
    data:
      type: array
      items:
        $ref: "#/OrganizationWithMembership"
    pagination:
      $ref: "./pagination.yaml#/Pagination"
