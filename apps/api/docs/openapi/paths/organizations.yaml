# docs/design/api/contract.md §4 — tenant isolation: ADR-0006, OCC: ADR-0007.
collection:
  post:
    tags: [Organizations]
    summary: Create an Organization
    description: |
      Creates the Organization, the caller's ACTIVE OWNER Membership, and an
      `ORGANIZATION_CREATED` Activity in one transaction.
    operationId: createOrganization
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/organizations.yaml#/CreateOrganizationRequest"
    responses:
      "201":
        description: Created.
        headers:
          Location:
            schema:
              type: string
              example: /api/v1/organizations/0b6f6c1e-8d2a-4f7e-9b2f-3a4c5d6e7f80
        content:
          application/json:
            schema:
              $ref: "../components/schemas/organizations.yaml#/OrganizationResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "415":
        $ref: "../components/responses.yaml#/UnsupportedMediaType"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  get:
    tags: [Organizations]
    summary: List my Organizations
    description: Organizations where the caller has an ACTIVE Membership, newest first.
    operationId: listOrganizations
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/limit"
      - $ref: "../components/parameters.yaml#/cursor"
    responses:
      "200":
        description: One page.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/organizations.yaml#/OrganizationListResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

item:
  parameters:
    - name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags: [Organizations]
    summary: Get an Organization
    operationId: getOrganization
    security:
      - BearerAuth: []
    responses:
      "200":
        description: The Organization and the caller's Membership.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/organizations.yaml#/OrganizationResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "404":
        $ref: "../components/responses.yaml#/OrganizationNotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  patch:
    tags: [Organizations]
    summary: Rename an Organization
    description: |
      OWNER or ADMIN only. A name equal to the current one (after trimming) is a no-op:
      200 with the unchanged resource and no Activity, checked before `version`.
      Otherwise the version must match; the update increments it and records
      `ORGANIZATION_UPDATED` in the same transaction.
    operationId: updateOrganization
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/organizations.yaml#/UpdateOrganizationRequest"
    responses:
      "200":
        description: Updated, or unchanged on a no-op.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/organizations.yaml#/OrganizationResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/OrganizationNotFound"
      "409":
        $ref: "../components/responses.yaml#/VersionConflict"
      "415":
        $ref: "../components/responses.yaml#/UnsupportedMediaType"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
