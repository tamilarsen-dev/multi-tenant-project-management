# docs/design/api/contract.md §3 — sessions: ADR-0003.
register:
  post:
    tags: [Authentication]
    summary: Register
    description: Creates a User and a first Session atomically.
    operationId: register
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth.yaml#/RegisterRequest"
    responses:
      "201":
        description: Registered and signed in.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/AuthResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "409":
        description: "`EMAIL_ALREADY_EXISTS`."
        content:
          application/json:
            schema:
              $ref: "../components/schemas/error.yaml#/ErrorResponse"
      "415":
        $ref: "../components/responses.yaml#/UnsupportedMediaType"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

login:
  post:
    tags: [Authentication]
    summary: Log in
    description: |
      Issues a new Session. An unknown email and a wrong password return the same
      `INVALID_CREDENTIALS` response with comparable timing.
    operationId: login
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth.yaml#/LoginRequest"
    responses:
      "200":
        description: Signed in.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/AuthResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        description: "`INVALID_CREDENTIALS`."
        headers:
          WWW-Authenticate:
            schema:
              type: string
              enum: [Bearer]
        content:
          application/json:
            schema:
              $ref: "../components/schemas/error.yaml#/ErrorResponse"
      "415":
        $ref: "../components/responses.yaml#/UnsupportedMediaType"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

refresh:
  post:
    tags: [Authentication]
    summary: Rotate the session
    description: |
      Atomically revokes the presented Session and issues a new one. The new `expiresAt`
      is `min(now + 7 days, absoluteExpiresAt)`; `absoluteExpiresAt` is inherited.
      Of concurrent refreshes with the same token exactly one succeeds. A revoked
      token is always `INVALID_SESSION`.
    operationId: refreshSession
    security:
      - BearerAuth: []
    responses:
      "200":
        description: New session. The old token no longer works.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/RefreshResponse"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

logout:
  post:
    tags: [Authentication]
    summary: Log out
    description: Revokes the current Session.
    operationId: logout
    security:
      - BearerAuth: []
    responses:
      "204":
        description: Revoked.
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

me:
  get:
    tags: [Authentication]
    summary: Current user
    operationId: getCurrentUser
    security:
      - BearerAuth: []
    responses:
      "200":
        description: The authenticated User.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/MeResponse"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
