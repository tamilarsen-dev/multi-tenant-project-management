openapi: 3.1.0

info:
  title: Project Management API
  version: 1.0.0
  description: |
    Multi-tenant project management API. This document covers milestone M1
    (identity and organizations); later endpoints are added by the slice that ships them.

    The normative rules live in the repository docs, which win on conflict:
    `docs/design/api/conventions.md` (envelopes, pagination, OCC),
    `docs/design/api/errors.md` (error catalog), and `docs/design/api/contract.md`.

    ## Conventions

    - Base path `/api/v1`; JSON only. A body without `Content-Type: application/json` → 415.
    - Request bodies reject unknown fields.
    - Single resources: `{ "data": { ... } }`. Lists: `{ "data": [...], "pagination": {...} }`.
    - Errors: `{ "error": { "code", "message", "details?" } }`. Branch on `code`.
    - Every response carries `X-Request-Id`; a well-formed client value is reused.
    - Protected endpoints take `Authorization: Bearer <accessToken>`; 401 responses
      include `WWW-Authenticate: Bearer`.
    - Mutable resources carry `version`; updates send it back (ADR-0007).
    - A resource in an Organization you are not an ACTIVE member of is reported as
      not found, never as forbidden (ADR-0006).

servers:
  - url: http://localhost:3000
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Liveness and readiness probes. Public.
  - name: Authentication
    description: Registration, login, and opaque Bearer sessions (ADR-0003).
  - name: Organizations
    description: Tenant workspaces and the caller's Membership in them.

