openapi: 3.1.0

info:
  title: Project Management API
  version: 1.0.0
  description: |
    # Project Management API

    A RESTful API for building and managing collaborative workspaces
    and project management workflows.

    The API follows a multi-tenant architecture, allowing users to
    create organizations and collaborate within isolated organizational
    environments.

    ## Core Capabilities

    The API is organized around the following functional domains:

    - **Authentication** — Register accounts, authenticate users,
      manage sessions, and retrieve the current authenticated user.
    - **Organizations** — Create and manage organizational workspaces.
    - **Health Monitoring** — Check API availability and service health.

    Additional capabilities, including memberships, invitations,
    projects, and issues, are part of the planned platform scope
    and will be documented as their endpoints become available.

    ## Getting Started

    Follow these steps to start interacting with the API:

    1. Explore the available endpoints in the API Reference.
    2. Register an account using the registration endpoint.
    3. Authenticate using the login endpoint.
    4. Use the returned authentication token for protected endpoints.
    5. Create an organization to establish your workspace.

    ## Authentication

    The API uses bearer token authentication for protected endpoints.

    Public endpoints, such as registration and login, do not require
    authentication.

    For protected endpoints, include the authentication token
    in the `Authorization` header:

    ```http
    Authorization: Bearer <your-token>
    ```

    Authentication requirements are specified individually
    for each endpoint.

    ## Multi-Tenancy

    Organizations act as isolated workspace boundaries.

    Users can belong to organizations through memberships.
    Organization-owned resources are scoped to their respective
    organizations.

    This model provides a foundation for collaboration and
    organization-level access control.

    ## API Conventions

    - Base path: `/api/v1`
    - Content type: `application/json`
    - Authentication: Bearer token for protected endpoints
    - Error responses: Standardized API error structure
    - Resource naming: REST-oriented resource paths

    ## API Versioning

    Versioned endpoints use the `/api/v1` URL prefix.

    The version prefix allows future API versions to evolve
    independently while maintaining compatibility with existing
    integrations.

    ## Documentation Structure

    - **Core API** — Health monitoring and authentication.
    - **Organization Management** — Organization-related operations.
    - **Schemas** — Reusable request, response, and data structures.

    Use the navigation sidebar to explore endpoints and inspect
    their parameters, request bodies, responses, and authentication
    requirements.

