openapi: 3.1.0
info:
  title: Project Management API
  version: 1.0.0
  description: |
    Multi-tenant project management API. This document covers milestone M1
    (identity and organizations); later endpoints are added by the slice that ships them.

    The normative rules live in the repository docs, which win on conflict:
    `docs/design/api/conventions.md` (envelopes, pagination, OCC),
    `docs/design/api/errors.md` (error catalog), and `docs/design/api/contract.md`.

    ## Conventions

    - Base path `/api/v1`; JSON only. A body without `Content-Type: application/json` → 415.
    - Request bodies reject unknown fields.
    - Single resources: `{ "data": { ... } }`. Lists: `{ "data": [...], "pagination": {...} }`.
    - Errors: `{ "error": { "code", "message", "details?" } }`. Branch on `code`.
    - Every response carries `X-Request-Id`; a well-formed client value is reused.
    - Protected endpoints take `Authorization: Bearer <accessToken>`; 401 responses
      include `WWW-Authenticate: Bearer`.
    - Mutable resources carry `version`; updates send it back (ADR-0007).
    - A resource in an Organization you are not an ACTIVE member of is reported as
      not found, never as forbidden (ADR-0006).
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - BearerAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes. Public.
  - name: Authentication
    description: Registration, login, and opaque Bearer sessions (ADR-0003).
  - name: Organizations
    description: Tenant workspaces and the caller's Membership in them.
paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness
      description: The process is up. Never touches the database.
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /readyz:
    get:
      tags:
        - Health
      summary: Readiness
      description: The process can serve traffic (database reachable within its timeout).
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Not ready. The body never includes the underlying error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableResponse'
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register
      description: Creates a User and a first Session atomically.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: '`EMAIL_ALREADY_EXISTS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: |
        Issues a new Session. An unknown email and a wrong password return the same
        `INVALID_CREDENTIALS` response with comparable timing.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: '`INVALID_CREDENTIALS`.'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate the session
      description: |
        Atomically revokes the presented Session and issues a new one. The new `expiresAt`
        is `min(now + 7 days, absoluteExpiresAt)`; `absoluteExpiresAt` is inherited.
        Of concurrent refreshes with the same token exactly one succeeds. A revoked
        token is always `INVALID_SESSION`.
      operationId: refreshSession
      security:
        - BearerAuth: []
      responses:
        '200':
          description: New session. The old token no longer works.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Revokes the current Session.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Current user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The authenticated User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/organizations:
    post:
      tags:
        - Organizations
      summary: Create an Organization
      description: |
        Creates the Organization, the caller's ACTIVE OWNER Membership, and an
        `ORGANIZATION_CREATED` Activity in one transaction.
      operationId: createOrganization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/organizations/0b6f6c1e-8d2a-4f7e-9b2f-3a4c5d6e7f80
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Organizations
      summary: List my Organizations
      description: Organizations where the caller has an ACTIVE Membership, newest first.
      operationId: listOrganizations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/organizations/{organizationId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Organizations
      summary: Get an Organization
      operationId: getOrganization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The Organization and the caller's Membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Organizations
      summary: Rename an Organization
      description: |
        OWNER or ADMIN only. A name equal to the current one (after trimming) is a no-op:
        200 with the unchanged resource and no Activity, checked before `version`.
        Otherwise the version must match; the update increments it and records
        `ORGANIZATION_UPDATED` in the same transaction.
      operationId: updateOrganization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated, or unchanged on a no-op.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque Session Token
      description: |
        Authentication using an opaque session token.

        Include the token in the Authorization header:

        Authorization: Bearer <session_token>
  schemas:
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - ok
    ErrorCode:
      type: string
      description: |
        Stable machine-readable code. The full catalog is in docs/design/api/errors.md;
        this enum lists the codes the M1 endpoints can return.
      enum:
        - INVALID_JSON
        - VALIDATION_ERROR
        - ROUTE_NOT_FOUND
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMIT_EXCEEDED
        - INTERNAL_SERVER_ERROR
        - MISSING_AUTHENTICATION
        - INVALID_SESSION
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - ORGANIZATION_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - VERSION_CONFLICT
    ValidationErrorDetails:
      type: object
      additionalProperties: false
      required:
        - fields
      properties:
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - code
              - message
            properties:
              path:
                type: array
                description: Body paths are unprefixed; params and query paths start with "params" / "query".
                items:
                  oneOf:
                    - type: string
                    - type: integer
                example:
                  - name
              code:
                type: string
                example: too_small
              message:
                type: string
    VersionConflictDetails:
      type: object
      additionalProperties: false
      required:
        - currentVersion
      properties:
        currentVersion:
          type: integer
          minimum: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable English message. Clients branch on `code`, never on `message`.
            details:
              description: Present only for codes whose catalog entry defines details.
              oneOf:
                - $ref: '#/components/schemas/ValidationErrorDetails'
                - $ref: '#/components/schemas/VersionConflictDetails'
    UnavailableResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - unavailable
    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and lowercased before validation and storage.
      example: dana@example.com
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - displayName
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Never trimmed or normalized.
          example: correct horse battery
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must be non-empty afterwards.
          example: Dana
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - accessToken
        - tokenType
        - expiresAt
        - absoluteExpiresAt
      properties:
        id:
          type: string
          format: uuid
        accessToken:
          type: string
          description: Opaque bearer token, returned only here. The server stores only its SHA-256 hash.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
          description: Sliding expiry, at most 7 days after issue.
        absoluteExpiresAt:
          type: string
          format: date-time
          description: Hard limit 30 days after login; refresh never extends it.
    AuthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - user
            - session
          properties:
            user:
              $ref: '#/components/schemas/User'
            session:
              $ref: '#/components/schemas/Session'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Any non-empty value; a wrong or short password is INVALID_CREDENTIALS, not a validation error.
    RefreshResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - session
          properties:
            session:
              $ref: '#/components/schemas/Session'
    MeResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - user
          properties:
            user:
              $ref: '#/components/schemas/User'
    Version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency token (ADR-0007). Send the version you last read.
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          $ref: '#/components/schemas/Version'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationRole:
      type: string
      enum:
        - OWNER
        - ADMIN
        - MEMBER
    MembershipStatus:
      type: string
      enum:
        - ACTIVE
        - REMOVED
    Membership:
      type: object
      additionalProperties: false
      required:
        - id
        - organizationId
        - user
        - role
        - status
        - version
        - joinedAt
        - removedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        user:
          type: object
          additionalProperties: false
          required:
            - id
            - email
            - displayName
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            displayName:
              type: string
        role:
          $ref: '#/components/schemas/OrganizationRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        version:
          $ref: '#/components/schemas/Version'
        joinedAt:
          type: string
          format: date-time
        removedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationWithMembership:
      type: object
      additionalProperties: false
      required:
        - organization
        - membership
      description: The Organization and the caller's own Membership in it.
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        membership:
          $ref: '#/components/schemas/Membership'
    Pagination:
      type: object
      additionalProperties: false
      required:
        - nextCursor
        - hasMore
        - totalCount
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          description: Opaque. Pass back unchanged as `cursor`; `null` on the last page.
        hasMore:
          type: boolean
        totalCount:
          type: integer
          minimum: 0
          description: Matching items across all pages, under the same filters.
    OrganizationListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationWithMembership'
        pagination:
          $ref: '#/components/schemas/Pagination'
    OrganizationName:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed; must be non-empty afterwards. Not unique.
      example: Acme Engineering
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/OrganizationName'
    OrganizationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/OrganizationWithMembership'
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - version
      properties:
        name:
          $ref: '#/components/schemas/OrganizationName'
        version:
          $ref: '#/components/schemas/Version'
  responses:
    RateLimited:
      description: '`RATE_LIMIT_EXCEEDED`. Honor `Retry-After`.'
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: '`VALIDATION_ERROR` (with `details.fields`) or `INVALID_JSON`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                fields:
                  - path:
                      - name
                    code: too_small
                    message: 'Too small: expected string to have >=1 characters'
    UnsupportedMediaType:
      description: '`UNSUPPORTED_MEDIA_TYPE`: a body was sent without `Content-Type: application/json`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: '`INTERNAL_SERVER_ERROR`. Report the `X-Request-Id` response header.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: '`MISSING_AUTHENTICATION` or `INVALID_SESSION` (unknown, expired, or revoked token).'
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum:
              - Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_SESSION
              message: The session is invalid or has expired
    OrganizationNotFound:
      description: |
        `ORGANIZATION_NOT_FOUND`: the Organization does not exist or the caller has no ACTIVE
        Membership in it. The two cases are indistinguishable by design (ADR-0006).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ORGANIZATION_NOT_FOUND
              message: Organization not found
    Forbidden:
      description: '`FORBIDDEN`: the caller is an ACTIVE member but the role does not allow the action.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionConflict:
      description: '`VERSION_CONFLICT`: `version` is stale. Re-read, then retry with `details.currentVersion`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VERSION_CONFLICT
              message: The resource was modified by another request
              details:
                currentVersion: 3
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    cursor:
      name: cursor
      in: query
      description: '`pagination.nextCursor` from the previous page. Unknown or malformed → `VALIDATION_ERROR`.'
      schema:
        type: string
        maxLength: 512
