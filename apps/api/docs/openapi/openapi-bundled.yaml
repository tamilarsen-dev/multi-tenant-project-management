openapi: 3.1.0
info:
  title: Project Management API
  version: 1.0.0
  description: |
    # Introduction

    The Project Management API provides a backend interface for managing
    organizations, memberships, invitations, projects, and issues.

    It is designed around a multi-tenant architecture, where users can
    collaborate within organizations and manage resources belonging to
    those organizations.

    ## What can you do?

    The API is organized into the following functional areas:

    - **Authentication** — Register and authenticate user accounts.
    - **Organizations** — Manage organization resources.
    - **Memberships** — Manage user membership within organizations.
    - **Invitations** — Invite users to join organizations.
    - **Projects** — Manage projects within an organization.
    - **Issues** — Manage work items associated with projects.
    - **Health** — Check API availability.

    ## Getting started

    To start integrating with the API:

    1. Review the available environments and base URLs.
    2. Understand the authentication flow.
    3. Authenticate when accessing protected endpoints.
    4. Include the required headers and request parameters.
    5. Handle success and error responses according to the API conventions.

    ## Authentication

    Some endpoints are publicly accessible, while others require authentication.

    Protected endpoints use the authentication mechanism described in the
    Authentication Guide. Each endpoint specifies its authentication
    requirements in the API Reference.

    ## Documentation structure

    Use the documentation sections to find the information you need:

    - **Getting Started** — Guides explaining API usage, authentication,
      conventions, and multi-tenancy.
    - **API Reference** — Technical specifications for each endpoint,
      including parameters, request bodies, responses, and error codes.
    - **Models & Schemas** — Definitions of reusable data structures
      used throughout the API.

    ## API versioning

    The current API uses the `/api/v1` URL prefix for versioned endpoints.
    The version prefix allows future API versions to evolve independently.
