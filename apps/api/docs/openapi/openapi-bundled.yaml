openapi: 3.1.0
info:
  title: Project Management API
  version: 1.0.0
  description: >
    Multi-tenant project management API. This document covers milestone M1

    (identity and organizations); later endpoints are added by the slice that
    ships them.


    The normative rules live in the repository docs, which win on conflict:

    `docs/design/api/conventions.md` (envelopes, pagination, OCC),

    `docs/design/api/errors.md` (error catalog), and
    `docs/design/api/contract.md`.


    ## Conventions


    - Base path `/api/v1`; JSON only. A body without `Content-Type:
    application/json` → 415.

    - Request bodies reject unknown fields.

    - Single resources: `{ "data": { ... } }`. Lists: `{ "data": [...],
    "pagination": {...} }`.

    - Errors: `{ "error": { "code", "message", "details?" } }`. Branch on
    `code`.

    - Every response carries `X-Request-Id`; a well-formed client value is
    reused.

    - Protected endpoints take `Authorization: Bearer <accessToken>`; 401
    responses
      include `WWW-Authenticate: Bearer`.
    - Mutable resources carry `version`; updates send it back (ADR-0007).

    - A resource in an Organization you are not an ACTIVE member of is reported
    as
      not found, never as forbidden (ADR-0006).
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - BearerAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes. Public.
  - name: Authentication
    description: Registration, login, and opaque Bearer sessions (ADR-0003).
  - name: Organizations
    description: Tenant workspaces and the caller's Membership in them.
paths:
  /healthz:
    $ref: "#/x-ext/a110403/liveness"
  /readyz:
    $ref: "#/x-ext/a110403/readiness"
  /api/v1/auth/register:
    $ref: "#/x-ext/dfb48ce/register"
  /api/v1/auth/login:
    $ref: "#/x-ext/dfb48ce/login"
  /api/v1/auth/refresh:
    $ref: "#/x-ext/dfb48ce/refresh"
  /api/v1/auth/logout:
    $ref: "#/x-ext/dfb48ce/logout"
  /api/v1/auth/me:
    $ref: "#/x-ext/dfb48ce/me"
  /api/v1/organizations:
    $ref: "#/x-ext/9e1a49c/collection"
  /api/v1/organizations/{organizationId}:
    $ref: "#/x-ext/9e1a49c/item"
components:
  securitySchemes:
    BearerAuth:
      $ref: "#/x-ext/4131fd1/BearerAuth"
x-ext:
  a189595:
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - ok
    UnavailableResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - unavailable
  146d2f2:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              $ref: "#/x-ext/146d2f2/ErrorCode"
            message:
              type: string
              description: Human-readable English message. Clients branch on `code`, never on
                `message`.
            details:
              description: Present only for codes whose catalog entry defines details.
              oneOf:
                - $ref: "#/x-ext/146d2f2/ValidationErrorDetails"
                - $ref: "#/x-ext/146d2f2/VersionConflictDetails"
    ErrorCode:
      type: string
      description: >
        Stable machine-readable code. The full catalog is in
        docs/design/api/errors.md;

        this enum lists the codes the M1 endpoints can return.
      enum:
        - INVALID_JSON
        - VALIDATION_ERROR
        - ROUTE_NOT_FOUND
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMIT_EXCEEDED
        - INTERNAL_SERVER_ERROR
        - MISSING_AUTHENTICATION
        - INVALID_SESSION
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - ORGANIZATION_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - VERSION_CONFLICT
    ValidationErrorDetails:
      type: object
      additionalProperties: false
      required:
        - fields
      properties:
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - code
              - message
            properties:
              path:
                type: array
                description: Body paths are unprefixed; params and query paths start with
                  "params" / "query".
                items:
                  oneOf:
                    - type: string
                    - type: integer
                example:
                  - name
              code:
                type: string
                example: too_small
              message:
                type: string
    VersionConflictDetails:
      type: object
      additionalProperties: false
      required:
        - currentVersion
      properties:
        currentVersion:
          type: integer
          minimum: 1
  5d7f27c:
    ValidationError:
      description: "`VALIDATION_ERROR` (with `details.fields`) or `INVALID_JSON`."
      content:
        application/json:
          schema:
            $ref: "#/x-ext/146d2f2/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                fields:
                  - path:
                      - name
                    code: too_small
                    message: "Too small: expected string to have >=1 characters"
    Unauthenticated:
      description: "`MISSING_AUTHENTICATION` or `INVALID_SESSION` (unknown, expired,
        or revoked token)."
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum:
              - Bearer
      content:
        application/json:
          schema:
            $ref: "#/x-ext/146d2f2/ErrorResponse"
          example:
            error:
              code: INVALID_SESSION
              message: The session is invalid or has expired
    Forbidden:
      description: "`FORBIDDEN`: the caller is an ACTIVE member but the role does not
        allow the action."
      content:
        application/json:
          schema:
            $ref: "#/x-ext/146d2f2/ErrorResponse"
    OrganizationNotFound:
      description: >
        `ORGANIZATION_NOT_FOUND`: the Organization does not exist or the caller
        has no ACTIVE

        Membership in it. The two cases are indistinguishable by design
        (ADR-0006).
      content:
        application/json:
          schema:
            $ref: "#/x-ext/146d2f2/ErrorResponse"
          example:
            error:
              code: ORGANIZATION_NOT_FOUND
              message: Organization not found
    VersionConflict:
      description: "`VERSION_CONFLICT`: `version` is stale. Re-read, then retry with
        `details.currentVersion`."
      content:
        application/json:
          schema:
            $ref: "#/x-ext/146d2f2/ErrorResponse"
          example:
            error:
              code: VERSION_CONFLICT
              message: The resource was modified by another request
              details:
                currentVersion: 3
    UnsupportedMediaType:
      description: "`UNSUPPORTED_MEDIA_TYPE`: a body was sent without `Content-Type:
        application/json`."
      content:
        application/json:
          schema:
            $ref: "#/x-ext/146d2f2/ErrorResponse"
    RateLimited:
      description: "`RATE_LIMIT_EXCEEDED`. Honor `Retry-After`."
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/x-ext/146d2f2/ErrorResponse"
    InternalError:
      description: "`INTERNAL_SERVER_ERROR`. Report the `X-Request-Id` response header."
      content:
        application/json:
          schema:
            $ref: "#/x-ext/146d2f2/ErrorResponse"
  a110403:
    liveness:
      get:
        tags:
          - Health
        summary: Liveness
        description: The process is up. Never touches the database.
        operationId: getLiveness
        security: []
        responses:
          "200":
            description: Alive.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/a189595/HealthResponse"
          "429":
            $ref: "#/x-ext/5d7f27c/RateLimited"
    readiness:
      get:
        tags:
          - Health
        summary: Readiness
        description: The process can serve traffic (database reachable within its timeout).
        operationId: getReadiness
        security: []
        responses:
          "200":
            description: Ready.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/a189595/HealthResponse"
          "429":
            $ref: "#/x-ext/5d7f27c/RateLimited"
          "503":
            description: Not ready. The body never includes the underlying error.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/a189595/UnavailableResponse"
  f36ff03:
    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and lowercased before validation and storage.
      example: dana@example.com
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - displayName
      properties:
        email:
          $ref: "#/x-ext/f36ff03/Email"
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Never trimmed or normalized.
          example: correct horse battery
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must be non-empty afterwards.
          example: Dana
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: "#/x-ext/f36ff03/Email"
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Any non-empty value; a wrong or short password is
            INVALID_CREDENTIALS, not a validation error.
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - accessToken
        - tokenType
        - expiresAt
        - absoluteExpiresAt
      properties:
        id:
          type: string
          format: uuid
        accessToken:
          type: string
          description: Opaque bearer token, returned only here. The server stores only its
            SHA-256 hash.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
          description: Sliding expiry, at most 7 days after issue.
        absoluteExpiresAt:
          type: string
          format: date-time
          description: Hard limit 30 days after login; refresh never extends it.
    AuthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - user
            - session
          properties:
            user:
              $ref: "#/x-ext/f36ff03/User"
            session:
              $ref: "#/x-ext/f36ff03/Session"
    RefreshResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - session
          properties:
            session:
              $ref: "#/x-ext/f36ff03/Session"
    MeResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - user
          properties:
            user:
              $ref: "#/x-ext/f36ff03/User"
  dfb48ce:
    register:
      post:
        tags:
          - Authentication
        summary: Register
        description: Creates a User and a first Session atomically.
        operationId: register
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/x-ext/f36ff03/RegisterRequest"
        responses:
          "201":
            description: Registered and signed in.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/f36ff03/AuthResponse"
          "400":
            $ref: "#/x-ext/5d7f27c/ValidationError"
          "409":
            description: "`EMAIL_ALREADY_EXISTS`."
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/146d2f2/ErrorResponse"
          "415":
            $ref: "#/x-ext/5d7f27c/UnsupportedMediaType"
          "429":
            $ref: "#/x-ext/5d7f27c/RateLimited"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
    login:
      post:
        tags:
          - Authentication
        summary: Log in
        description: >
          Issues a new Session. An unknown email and a wrong password return the
          same

          `INVALID_CREDENTIALS` response with comparable timing.
        operationId: login
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/x-ext/f36ff03/LoginRequest"
        responses:
          "200":
            description: Signed in.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/f36ff03/AuthResponse"
          "400":
            $ref: "#/x-ext/5d7f27c/ValidationError"
          "401":
            description: "`INVALID_CREDENTIALS`."
            headers:
              WWW-Authenticate:
                schema:
                  type: string
                  enum:
                    - Bearer
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/146d2f2/ErrorResponse"
          "415":
            $ref: "#/x-ext/5d7f27c/UnsupportedMediaType"
          "429":
            $ref: "#/x-ext/5d7f27c/RateLimited"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
    refresh:
      post:
        tags:
          - Authentication
        summary: Rotate the session
        description: >
          Atomically revokes the presented Session and issues a new one. The new
          `expiresAt`

          is `min(now + 7 days, absoluteExpiresAt)`; `absoluteExpiresAt` is
          inherited.

          Of concurrent refreshes with the same token exactly one succeeds. A
          revoked

          token is always `INVALID_SESSION`.
        operationId: refreshSession
        security:
          - BearerAuth: []
        responses:
          "200":
            description: New session. The old token no longer works.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/f36ff03/RefreshResponse"
          "401":
            $ref: "#/x-ext/5d7f27c/Unauthenticated"
          "429":
            $ref: "#/x-ext/5d7f27c/RateLimited"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
    logout:
      post:
        tags:
          - Authentication
        summary: Log out
        description: Revokes the current Session.
        operationId: logout
        security:
          - BearerAuth: []
        responses:
          "204":
            description: Revoked.
          "401":
            $ref: "#/x-ext/5d7f27c/Unauthenticated"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
    me:
      get:
        tags:
          - Authentication
        summary: Current user
        operationId: getCurrentUser
        security:
          - BearerAuth: []
        responses:
          "200":
            description: The authenticated User.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/f36ff03/MeResponse"
          "401":
            $ref: "#/x-ext/5d7f27c/Unauthenticated"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
