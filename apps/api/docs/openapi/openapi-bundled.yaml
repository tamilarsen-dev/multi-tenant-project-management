      schema:
        type: string
        maxLength: 512
  9e1a49c:
    collection:
      post:
        tags:
          - Organizations
        summary: Create an Organization
        description: |
          Creates the Organization, the caller's ACTIVE OWNER Membership, and an
          `ORGANIZATION_CREATED` Activity in one transaction.
        operationId: createOrganization
        security:
          - BearerAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/x-ext/3cf926f/CreateOrganizationRequest"
        responses:
          "201":
            description: Created.
            headers:
              Location:
                schema:
                  type: string
                  example: /api/v1/organizations/0b6f6c1e-8d2a-4f7e-9b2f-3a4c5d6e7f80
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/3cf926f/OrganizationResponse"
          "400":
            $ref: "#/x-ext/5d7f27c/ValidationError"
          "401":
            $ref: "#/x-ext/5d7f27c/Unauthenticated"
          "415":
            $ref: "#/x-ext/5d7f27c/UnsupportedMediaType"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
      get:
        tags:
          - Organizations
        summary: List my Organizations
        description: Organizations where the caller has an ACTIVE Membership, newest first.
        operationId: listOrganizations
        security:
          - BearerAuth: []
        parameters:
          - $ref: "#/x-ext/2fcb753/limit"
          - $ref: "#/x-ext/2fcb753/cursor"
        responses:
          "200":
            description: One page.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/3cf926f/OrganizationListResponse"
          "400":
            $ref: "#/x-ext/5d7f27c/ValidationError"
          "401":
            $ref: "#/x-ext/5d7f27c/Unauthenticated"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
    item:
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      get:
        tags:
          - Organizations
        summary: Get an Organization
        operationId: getOrganization
        security:
          - BearerAuth: []
        responses:
          "200":
            description: The Organization and the caller's Membership.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/3cf926f/OrganizationResponse"
          "400":
            $ref: "#/x-ext/5d7f27c/ValidationError"
          "401":
            $ref: "#/x-ext/5d7f27c/Unauthenticated"
          "404":
            $ref: "#/x-ext/5d7f27c/OrganizationNotFound"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
      patch:
        tags:
          - Organizations
        summary: Rename an Organization
        description: >
          OWNER or ADMIN only. A name equal to the current one (after trimming)
          is a no-op:

          200 with the unchanged resource and no Activity, checked before
          `version`.

          Otherwise the version must match; the update increments it and records

          `ORGANIZATION_UPDATED` in the same transaction.
        operationId: updateOrganization
        security:
          - BearerAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/x-ext/3cf926f/UpdateOrganizationRequest"
        responses:
          "200":
            description: Updated, or unchanged on a no-op.
            content:
              application/json:
                schema:
                  $ref: "#/x-ext/3cf926f/OrganizationResponse"
          "400":
            $ref: "#/x-ext/5d7f27c/ValidationError"
          "401":
            $ref: "#/x-ext/5d7f27c/Unauthenticated"
          "403":
            $ref: "#/x-ext/5d7f27c/Forbidden"
          "404":
            $ref: "#/x-ext/5d7f27c/OrganizationNotFound"
          "409":
            $ref: "#/x-ext/5d7f27c/VersionConflict"
          "415":
            $ref: "#/x-ext/5d7f27c/UnsupportedMediaType"
          "500":
            $ref: "#/x-ext/5d7f27c/InternalError"
  4131fd1:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque Session Token
      description: |
        Authentication using an opaque session token.

        Include the token in the Authorization header:

        Authorization: Bearer <session_token>
