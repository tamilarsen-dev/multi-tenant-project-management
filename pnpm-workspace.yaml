allowBuilds:
  builds: true
  esbuild: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - icu-minify@4.15.0
  - next-intl-swc-plugin-extractor@4.15.0
  - next-intl@4.15.0
  - use-intl@4.15.0
packages:
  - "apps/*"
permissions:
  "@prisma/engines":
    build: true
  "@quobix/vacuum":
    build: true
  "@scarf/scarf":
    build: false
  argon2:
    build: true
  builds:
    skills: true
  prisma:
    build: true
