services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: project_management
    volumes:
      - mtpm-deploy-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d project_management"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: mtpm-api:release-lab
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/project_management
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mtpm-deploy-pgdata:
    external: true
    name: mtpm-deploy-pgdata