services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: project_management
    volumes:
      - mtpm-deploy-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d project_management"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: mtpm-api:release-lab
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/project_management
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - mtpm-net

  nginx:
    image: nginx:alpine
    ports:
      - "192.168.45.2:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - mtpm-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    restart: unless-stopped
    networks:
      - mtpm-net

volumes:
  mtpm-deploy-pgdata:
    external: true
    name: mtpm-deploy-pgdata

networks:
  mtpm-net:
    external: true
    name: mtpm-net
